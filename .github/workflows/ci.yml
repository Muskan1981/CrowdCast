name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: backend/go.mod
  NODE_VERSION: "22"
  # Same values as .env.example. CI never uses real secrets.
  TEST_REDIS_URL: redis://localhost:6379/15
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/crowdcast_test?sslmode=disable

jobs:
  backend:
    name: backend (lint, vet, race tests, coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crowdcast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: backend

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 -coverprofile=coverage.out ./... 2>&1 | tee test-output.txt

      - name: core package coverage (>= 70%)
        run: ../scripts/check_coverage.sh test-output.txt 70

      - name: benchmarks compile and run once
        run: go test -run xxx -bench . -benchtime=1x ./internal/hub/ ./internal/reactions/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/test-output.txt

  frontend:
    name: frontend (build, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crowdcast-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: crowdcast-frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  images:
    name: docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: api image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: api
          load: true
          tags: crowdcast-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: loadgen image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: loadgen
          load: true
          tags: crowdcast-loadgen:ci
          cache-from: type=gha,scope=loadgen
          cache-to: type=gha,mode=max,scope=loadgen

      - name: frontend image
        uses: docker/build-push-action@v6
        with:
          context: crowdcast-frontend
          load: true
          tags: crowdcast-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  compose-smoke:
    name: compose smoke and end-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cp .env.example .env

      - name: stack up (waits for health checks)
        run: make up

      - name: health check
        run: |
          docker compose --env-file .env -f deploy/docker-compose.yml ps
          curl -fsS http://localhost:8080/readyz
          test "$(docker compose --env-file .env -f deploy/docker-compose.yml ps --format '{{.Health}}' | grep -c unhealthy)" = "0"

      - name: 30 second load run with assertions
        run: |
          make loadgen LOADGEN_SCENARIO=steady LOADGEN_USERS=100 LOADGEN_DURATION=30s
          python3 - <<'PY'
          import json, sys
          s = json.load(open("loadgen-out/loadgen-summary.json"))
          errs = 100.0 * s["http_errors"] / max(1, s["http_requests"])
          print(json.dumps({k: s[k] for k in ("sessions_ok", "connected_peak", "msgs_in", "http_requests", "http_errors")}))
          print("served_by_pct", s["served_by_pct"])
          assert s["sessions_ok"] >= 95, "most viewers should join"
          assert errs < 2.0, f"error ratio {errs:.2f}% >= 2%"
          assert len(s["served_by_pct"]) == 3, "all three nodes should serve traffic"
          PY

      - name: "end-to-end: kill a node, assert the error ratio and the rebalance"
        run: scripts/e2e.sh

      - name: dump logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/docker-compose.yml logs --tail 200

      - name: tear down
        if: always()
        run: make reset
