# golangci-lint v2 configuration. Run with: make lint (or golangci-lint run ./... in backend/).
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - misspell
  settings:
    govet:
      disable:
        - fieldalignment
    revive:
      # The `exported` rule (doc comments on every exported symbol) is turned off on
      # purpose: this is an application, not a library, and most symbols are
      # described by the package docs and docs/API_CONTRACT.md instead.
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      # Test helpers and benchmark fixtures do not need doc comments.
      - path: _test\.go
        linters: [revive]

formatters:
  enable:
    - gofmt
