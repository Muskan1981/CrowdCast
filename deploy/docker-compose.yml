services:
  postgres:
    image: postgres:16-alpine
    container_name: crowdcast-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crowdcast
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crowdcast"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - crowdcast-net

  redis:
    image: redis:7-alpine
    container_name: crowdcast-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redisdata:/data
    networks:
      - crowdcast-net

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: crowdcast-api-01
    environment:
      INSTANCE_ID: crowdcast-api-01
      INSTANCE_ZONE: Primary node
      INSTANCE_WEIGHT: "50"
      HTTP_ADDR: ":8080"
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crowdcast?sslmode=disable
      PROMETHEUS_URL: http://prometheus:9090
      JWT_SECRET: dev-crowdcast-secret-key-32chars!
      ADMIN_API_KEY: admin-secret-key
      ALLOWED_ORIGINS: "*"
      WS_MAX_CONNS: "10000"
      REACTION_BATCH_MS: "250"
      CHAT_RATE_LIMIT: "1500ms"
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped
    networks:
      - crowdcast-net

networks:
  crowdcast-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
