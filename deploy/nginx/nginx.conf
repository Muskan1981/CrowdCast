# CrowdCast load balancer.
# Weighted upstream 5:3:2 (50/30/20). Passive health checks take a node out of
# rotation after two failures for 10 s. Only idempotent methods are retried.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # JSON access log with the upstream details the demo needs.
    log_format json_access escape=json
        '{"time":"$time_iso8601",'
        '"request_id":"$upstream_http_x_request_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"x_served_by":"$upstream_http_x_instance"}';

    access_log /var/log/nginx/access.log json_access;
    error_log  /var/log/nginx/error.log warn;

    upstream crowdcast_api {
        server crowdcast-api-01:8080 weight=5 max_fails=2 fail_timeout=10s;
        server crowdcast-api-02:8080 weight=3 max_fails=2 fail_timeout=10s;
        server crowdcast-api-03:8080 weight=2 max_fails=2 fail_timeout=10s;
        keepalive 64;
    }

    # Public listener.
    server {
        listen 8080;
        server_name _;

        # Shared proxy settings for REST and WebSocket traffic.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        # Pass the serving node to the browser. The API sets X-Instance on every response.
        add_header X-Served-By $upstream_http_x_instance always;

        # /metrics is internal. Prometheus scrapes the instances over the Docker network.
        location = /metrics {
            return 404;
        }

        # Admin routes need the admin key at the edge. The API checks the key too.
        location ^~ /api/v1/admin/ {
            if ($http_x_admin_key = "") {
                return 403;
            }
            proxy_pass http://crowdcast_api;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
        }

        # Session creation is the one POST that is retried. A node in chaos fail
        # answers 503 before it touches any state, so replaying the request on
        # another node cannot duplicate anything. Without this, every viewer who
        # joins during a node failure gets an error.
        location = /api/v1/session {
            proxy_pass http://crowdcast_api;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 3;
        }

        # REST API. Retries cover GET and other idempotent requests only.
        # nginx never replays POST unless "non_idempotent" is set, so the default
        # behaviour is kept and POST requests are never sent to a second node.
        location /api/ {
            proxy_pass http://crowdcast_api;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;
        }

        # WebSocket: upgrade headers, a one-hour timeout and no buffering.
        location ~ ^/(api/v1/)?ws$ {
            proxy_pass http://crowdcast_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 2s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
        }

        # Health probes, reachable through the balancer for checks and demos.
        location = /healthz {
            proxy_pass http://crowdcast_api;
            proxy_next_upstream off;
        }

        location = /readyz {
            proxy_pass http://crowdcast_api;
            proxy_next_upstream off;
        }

        # Frontend container (built from crowdcast-frontend, serves the SPA itself).
        location / {
            proxy_pass http://frontend:80;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }

    # Internal listener for nginx's own status. Not published to the host.
    server {
        listen 8088;
        server_name _;

        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;

        location = /nginx_status {
            stub_status;
        }
    }
}
