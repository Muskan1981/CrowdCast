# Scrape configuration for the CrowdCast stack.
#
# honor_labels: true keeps the instance="crowdcast-api-0N" label that the app sets
# itself, instead of Prometheus overwriting it with the scrape address. The node
# label (set below) is what the alerts use to name a node in a message.

global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    cluster: crowdcast-local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
      # Alertmanager only exists in the `alerts` profile; errors there are not fatal.

scrape_configs:
  - job_name: crowdcast-api
    metrics_path: /metrics
    honor_labels: true
    static_configs:
      - targets: ["api-01:8080"]
        labels: { node: crowdcast-api-01 }
      - targets: ["api-02:8080"]
        labels: { node: crowdcast-api-02 }
      - targets: ["api-03:8080"]
        labels: { node: crowdcast-api-03 }

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
